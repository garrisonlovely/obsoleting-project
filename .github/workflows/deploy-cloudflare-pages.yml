# obsoletingproject.com is served by the Cloudflare Pages project "obsoletingproject"
# (DNS is on Cloudflare), not by Netlify. Netlify still builds PR deploy previews.
# This publishes main to that Pages project on every push.
# Needs repository secret CLOUDFLARE_API_TOKEN with "Account > Cloudflare Pages > Edit".
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROJECT: obsoletingproject
    steps:
      - uses: actions/checkout@v5
      - name: Check for the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit)."
            exit 1
          fi
      - name: Look up account and production branch
        env:
          ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          summary() { jq -c '{success, errors: [.errors[]?.message], results: (.result | if type == "array" then length else (if . == null then 0 else 1 end) end)}'; }
          echo "user token verify: $(api /user/tokens/verify | summary)"
          ACCOUNT_ID="$ACCOUNT_ID_VAR"
          if [ -z "$ACCOUNT_ID" ]; then
            r=$(api "/accounts?per_page=50"); echo "/accounts: $(echo "$r" | summary)"
            ACCOUNT_ID=$(echo "$r" | jq -r '.result[0].id // empty')
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            r=$(api /memberships); echo "/memberships: $(echo "$r" | summary)"
            ACCOUNT_ID=$(echo "$r" | jq -r '.result[0].account.id // empty')
          fi
          # A Pages-only token can't list its account, so fall back to Garrison's Cloudflare
          # account ID (not a secret; approved by Garrison for this deploy).
          ACCOUNT_ID="${ACCOUNT_ID:-fd4be337c12518eab8dd73b47dd8b536}"
          echo "account token verify: $(api "/accounts/$ACCOUNT_ID/tokens/verify" | summary)"
          r=$(api "/accounts/$ACCOUNT_ID/pages/projects/$PROJECT"); echo "pages project: $(echo "$r" | summary)"
          BRANCH=$(echo "$r" | jq -r '.result.production_branch // empty')
          [ -n "$BRANCH" ] || { echo "::error::Could not read Pages project $PROJECT with this token."; exit 1; }
          echo "production branch: $BRANCH"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "PROD_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Stage site files
        run: rsync -a --exclude .git --exclude .github --exclude '*.md' --exclude netlify.toml ./ "$RUNNER_TEMP/site/"
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/site" --project-name="$PROJECT" --branch="$PROD_BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true
      - name: Verify the live domain serves this commit's homepage
        run: |
          marker=$(grep -o '<title>[^<]*</title>' index.html | head -1)
          expected=$(sha256sum index.html | cut -d' ' -f1)
          for i in $(seq 1 20); do
            got=$(curl -sS "https://obsoletingproject.com/?deploycheck=$GITHUB_SHA-$i" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$expected" ] && { echo "Live: obsoletingproject.com matches $GITHUB_SHA"; exit 0; }
            sleep 6
          done
          echo "::error::obsoletingproject.com does not match index.html at $GITHUB_SHA after deploy."
          exit 1

name: diag-live-site
on:
  push:
    branches: [diag-live-site]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Identify what serves obsoletingproject.com
        run: |
          set +e
          echo "### full headers for the live domain"
          curl -sS -m 25 -D - -o /dev/null "https://obsoletingproject.com/?x=$RANDOM"
          for path in netlify.toml README.md robots.txt logo.svg _headers _redirects 404.html wrangler.toml; do
            code=$(curl -sS -m 20 -o /tmp/b -w '%{http_code} %{content_type} %{size_download}' "https://obsoletingproject.com/$path")
            echo "### /$path -> $code :: $(head -c 120 /tmp/b | tr '\n' ' ')"
          done
          for h in obsoletingproject obsoleting-project the-obsoleting-project obsoletingproject-com obsoleting obsolete-project; do
            code=$(curl -sS -m 20 -o /tmp/b -w '%{http_code}' "https://$h.pages.dev/")
            echo "### $h.pages.dev -> $code :: title=$(grep -o '<title>[^<]*</title>' /tmp/b | head -1) fraunces=$(grep -c Fraunces /tmp/b) risk=$(grep -c 'Risk factors' /tmp/b)"
          done
          echo "### TXT/CAA/MX"
          dig +short TXT obsoletingproject.com; dig +short CAA obsoletingproject.com; dig +short MX obsoletingproject.com
          echo "### Netlify site with Host header for the custom domain"
          curl -sS -m 20 -o /tmp/b -w '%{http_code}\n' -H 'Host: obsoletingproject.com' http://75.2.60.5/ ; head -c 200 /tmp/b; echo
